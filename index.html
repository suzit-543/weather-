<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Weather Dashboard</h1>

        <div class="search-box">
            <input type="text" id="city-input" placeholder="Enter city name..." autocomplete="off">
            <div class="btn-row">
                <button id="searchbtn">Search</button>
                <button id="locationbtn" title="Use my location">📍 My Location</button>
            </div>
        </div>

        <div id="display">
            <p class="placeholder">Search a city to see the weather</p>
        </div>

        <div id="forecast-container"></div>

        <div class="history">
            <h3>Recent Searches</h3>
            <p class="remove">(Click a city to search again · × to remove)</p>
            <ul id="list"></ul>
            <button id="clear">Clear All</button>
        </div>
    </div>
    <script src="key.js"></script>
    <script src="weather.js"></script>
</body>
</html>
